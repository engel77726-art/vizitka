<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Дегтярёва Анжелика — Нейро-СММ</title>
<meta name="description" content="Дегтярёва Анжелика — специалист по нейро-СММ. Telegram: @SMM-NEURO">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #f4f4f6;
    --muted: #9a9aa6;
    --c1: #7c5cff;   /* фиолетовый */
    --c2: #00d4ff;   /* циан */
    --c3: #ff4fd8;   /* розовый */
    --card: rgba(255, 255, 255, 0.035);
    --border: rgba(255, 255, 255, 0.09);
    --grad: linear-gradient(120deg, var(--c1), var(--c2), var(--c3), var(--c1));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- фон: нейросеть + цветные пятна ---------- */
  #net {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.28;
    z-index: 0;
    pointer-events: none;
    animation: float 18s ease-in-out infinite;
  }
  .blob.b1 { width: 420px; height: 420px; background: var(--c1); top: -120px; left: -120px; }
  .blob.b2 { width: 360px; height: 360px; background: var(--c2); bottom: -120px; right: -100px; animation-delay: -6s; }
  .blob.b3 { width: 260px; height: 260px; background: var(--c3); top: 45%; left: 60%; opacity: 0.16; animation-delay: -12s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, 30px) scale(1.08); }
    66%      { transform: translate(-30px, 20px) scale(0.95); }
  }

  /* ---------- карточка ---------- */
  .card {
    position: relative;
    z-index: 1;
    width: min(100%, 520px);
    padding: clamp(32px, 7vw, 56px) clamp(22px, 6vw, 48px);
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    text-align: center;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
    transform-style: preserve-3d;
    transition: transform 0.25s ease-out;
    animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both;
  }

  /* светящаяся рамка */
  .card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: var(--grad);
    background-size: 300% 300%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0.55;
    animation: shift 8s linear infinite;
    pointer-events: none;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- аватар-монограмма ---------- */
  .avatar {
    width: 96px;
    height: 96px;
    margin: 0 auto 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: 1px;
    background: #111;
  }
  .avatar::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c1));
    z-index: -1;
    animation: spin 6s linear infinite;
  }
  .avatar::after {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c1));
    filter: blur(20px);
    opacity: 0.45;
    z-index: -2;
    animation: spin 6s linear infinite;
  }
  .avatar span {
    background: var(--grad);
    background-size: 300% 300%;
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    animation: shift 6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- имя ---------- */
  .name {
    font-size: clamp(30px, 8.5vw, 52px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
  }
  .name .line { display: block; padding: 0.08em 0.06em; }

  .name .fill {
    display: block;
    padding: 0.1em 0.12em;
    background: var(--grad);
    background-size: 300% 300%;
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    /* чёткий текст + мягкое свечение вокруг букв */
    filter: drop-shadow(0 0 6px rgba(124, 92, 255, 0.55)) drop-shadow(0 0 18px rgba(0, 212, 255, 0.3));
    animation: shift 6s linear infinite, pulse 3.5s ease-in-out infinite;
  }

  @keyframes shift {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(124, 92, 255, 0.45)) drop-shadow(0 0 12px rgba(0, 212, 255, 0.2)); }
    50%      { filter: drop-shadow(0 0 8px rgba(255, 79, 216, 0.6)) drop-shadow(0 0 22px rgba(0, 212, 255, 0.35)); }
  }

  /* ---------- специализация ---------- */
  .role {
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    font-size: clamp(13px, 3.6vw, 15px);
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #dcdce6;
  }
  .role .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--c2);
    box-shadow: 0 0 10px var(--c2), 0 0 20px var(--c2);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  .tagline {
    margin: 22px auto 0;
    max-width: 34ch;
    color: var(--muted);
    font-size: clamp(14px, 3.8vw, 16px);
    line-height: 1.6;
  }

  .divider {
    height: 1px;
    margin: 30px auto;
    width: 70%;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  /* ---------- соцсети ---------- */
  .socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .social {
    --accent: var(--c2);
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    color: var(--text);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    cursor: pointer;
    text-decoration: none;
    font: inherit;
    transition: transform 0.35s cubic-bezier(.3,1.6,.5,1), background 0.3s, border-color 0.3s, box-shadow 0.3s, color 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  .social svg { width: 24px; height: 24px; transition: transform 0.35s cubic-bezier(.3,1.6,.5,1); }

  .social:hover,
  .social:focus-visible {
    transform: translateY(-6px);
    color: #fff;
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    border-color: var(--accent);
    box-shadow: 0 10px 30px -6px var(--accent), 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent);
    outline: none;
  }
  .social:hover svg { transform: scale(1.15) rotate(-8deg); }
  .social:active { transform: translateY(-2px) scale(0.95); }

  .social.tg    { --accent: #29b6f6; }
  .social.copy  { --accent: var(--c1); }
  .social.share { --accent: var(--c3); }

  /* подсказка */
  .social .tip {
    position: absolute;
    bottom: calc(100% + 12px);
    left: 50%;
    transform: translate(-50%, 6px);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    background: #1a1a1f;
    border: 1px solid var(--border);
    color: var(--text);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .social:hover .tip,
  .social:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }

  .handle {
    margin-top: 18px;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .handle b { color: var(--text); font-weight: 600; }

  /* ---------- кнопка «Написать мне» ---------- */
  .cta {
    position: relative;
    margin-top: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    padding: 18px 32px;
    border-radius: 999px;
    border: none;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    background: var(--grad);
    background-size: 300% 300%;
    animation: shift 5s linear infinite, breathe 2.8s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(.3,1.6,.5,1);
    -webkit-tap-highlight-color: transparent;
  }

  /* блик, пробегающий по кнопке */
  .cta::before {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 20px -4px var(--c1), 0 0 40px -10px var(--c2); }
    50%      { box-shadow: 0 0 34px 0 var(--c3), 0 0 70px -6px var(--c2); }
  }
  @keyframes shine {
    0%, 60% { left: -75%; }
    100%    { left: 130%; }
  }

  .cta svg { width: 20px; height: 20px; transition: transform 0.4s cubic-bezier(.3,1.6,.5,1); }
  .cta:hover,
  .cta:focus-visible { transform: translateY(-3px) scale(1.03); outline: none; }
  .cta:hover svg { transform: translateX(5px) rotate(-12deg); }
  .cta:active { transform: scale(0.97); }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: scale(0);
    animation: ripple 0.7s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* ---------- уведомление ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: max(28px, env(safe-area-inset-bottom));
    transform: translate(-50%, 30px);
    z-index: 10;
    padding: 12px 22px;
    border-radius: 14px;
    background: #16161b;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 10px 40px -10px var(--c1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  footer {
    margin-top: 30px;
    font-size: 12px;
    color: #5c5c66;
    letter-spacing: 0.1em;
  }

  /* ---------- телефон ---------- */
  @media (max-width: 420px) {
    .avatar { width: 80px; height: 80px; font-size: 26px; margin-bottom: 22px; }
    .social { width: 52px; height: 52px; border-radius: 16px; }
    .socials { gap: 12px; }
    .role { letter-spacing: 0.2em; }
    .cta { padding: 17px 24px; font-size: 16px; }
  }

  @media (hover: none) {
    .social .tip { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <canvas id="net" aria-hidden="true"></canvas>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>

  <main class="card" id="card">

    <div class="avatar" aria-hidden="true"><span>ДА</span></div>

    <h1 class="name">
      <span class="fill"><span class="line">Дегтярёва</span><span class="line">Анжелика</span></span>
    </h1>

    <div>
      <div class="role"><span class="dot"></span>Нейро-СММ</div>
    </div>

    <p class="tagline">Продвижение в соцсетях с помощью нейросетей: контент, визуал и стратегия, которые работают.</p>

    <div class="divider"></div>

    <nav class="socials" aria-label="Контакты">
      <!-- Telegram -->
      <a class="social tg" href="https://t.me/SMM-NEURO" target="_blank" rel="noopener" aria-label="Telegram @SMM-NEURO">
        <span class="tip">Telegram</span>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.94 4.3a1.2 1.2 0 0 0-1.62-1.33L2.9 9.7c-.97.38-.95 1.76.03 2.1l4.42 1.52 1.7 5.36c.24.76 1.2.99 1.76.42l2.47-2.5 4.43 3.27c.7.52 1.7.13 1.88-.72L21.94 4.3ZM9.6 13.95l8.5-6.9-6.86 8.2-.33 2.84-1.31-4.14Z"/>
        </svg>
      </a>

      <!-- Скопировать ник -->
      <button class="social copy" type="button" id="copyBtn" aria-label="Скопировать ник">
        <span class="tip">Скопировать ник</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="3"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>

      <!-- Поделиться -->
      <button class="social share" type="button" id="shareBtn" aria-label="Поделиться визиткой">
        <span class="tip">Поделиться</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>
        </svg>
      </button>

      <!--
        Чтобы добавить ещё соцсеть, скопируйте блок <a class="social tg" ...>,
        замените href, подпись в .tip и SVG-иконку.
      -->
    </nav>

    <p class="handle">Telegram: <b>@SMM-NEURO</b></p>

    <a class="cta" id="cta" href="https://t.me/SMM-NEURO" target="_blank" rel="noopener">
      Написать мне
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/>
      </svg>
    </a>

    <footer>© <span id="year"></span> · Нейро-СММ</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const HANDLE = '@SMM-NEURO';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---------- уведомление ---------- */
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /* ---------- копирование ---------- */
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      return ok;
    }
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const ok = await copyText(HANDLE);
    showToast(ok ? 'Ник ' + HANDLE + ' скопирован ✓' : 'Ник: ' + HANDLE);
  });

  /* ---------- поделиться ---------- */
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const data = {
      title: 'Дегтярёва Анжелика — Нейро-СММ',
      text: 'Нейро-СММ специалист. Telegram: ' + HANDLE,
      url: location.href
    };
    if (navigator.share) {
      try { await navigator.share(data); } catch (_) {}
    } else {
      const ok = await copyText(data.text + ' ' + data.url);
      showToast(ok ? 'Ссылка скопирована ✓' : 'Не удалось скопировать');
    }
  });

  /* ---------- волна при нажатии на кнопку ---------- */
  const cta = document.getElementById('cta');
  cta.addEventListener('pointerdown', (e) => {
    const r = cta.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = size + 'px';
    s.style.left = (e.clientX - r.left - size / 2) + 'px';
    s.style.top = (e.clientY - r.top - size / 2) + 'px';
    cta.appendChild(s);
    setTimeout(() => s.remove(), 700);
  });

  /* ---------- 3D-наклон карточки (только мышь) ---------- */
  const card = document.getElementById('card');
  if (!reduceMotion && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `perspective(900px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 6).toFixed(2)}deg)`;
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  }

  /* ---------- фон: «нейросеть» ---------- */
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, nodes = [];
  const mouse = { x: -9999, y: -9999 };
  const colors = ['124,92,255', '0,212,255', '255,79,216'];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(90, (w * h) / 16000));
    nodes = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      r: Math.random() * 1.6 + 0.6,
      c: colors[Math.floor(Math.random() * colors.length)]
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    const maxDist = Math.min(150, w / 6 + 40);

    for (const n of nodes) {
      if (!reduceMotion) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }
    }

    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.hypot(dx, dy);
        if (d < maxDist) {
          ctx.strokeStyle = `rgba(${a.c},${(1 - d / maxDist) * 0.22})`;
          ctx.lineWidth = 0.7;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      // связи с курсором
      const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
      if (md < maxDist * 1.4) {
        ctx.strokeStyle = `rgba(${a.c},${(1 - md / (maxDist * 1.4)) * 0.5})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
      ctx.fillStyle = `rgba(${a.c},0.9)`;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); if (reduceMotion) draw(); });
  window.addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

  resize();
  draw();
})();
</script>
</body>
</html>
